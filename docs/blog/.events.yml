# Community events. The curated spine of /blog/events.
#
# UNLIKE .schedule.yml (bot-owned), this file is HAND-EDITED. Adding an event is
# a normal PR. Append an entry, drop any imagery under docs/assets/, and list the
# slugs of the posts written about it.
#
# An event CLAIMS a post by listing its `slug:` under `posts:`. A claimed post
# renders inside the event card instead of as its own timeline entry, so a
# hackathon and its three write-ups read as one moment rather than four.
# Published posts in the "Community" category that no event claims still appear
# on the timeline on their own. Nothing has to be registered here to show up.
#
# Fields
#   id        required, kebab-case, unique. React key + anchor.
#   title     required. Card headline.
#   kind      required. Badge on the card: Hackathon | Program | Course | Meetup
#             | Launch. Free text, so a new kind just works.
#   start     required. YYYY-MM-DD, or YYYY-MM / YYYY when only the month or year
#             is known. Drives ordering (newest first).
#   end       optional. YYYY-MM-DD. Renders a range: "May 15–19, 2026".
#   date_label  optional. Overrides the rendered date entirely when a range does
#             not describe it well ("Winter semester 2026").
#   location  optional. Shown under the title.
#   url       optional. Event site / project gallery, opens in a new tab.
#   summary   optional. Two or three sentences, plain text.
#   cover     optional. `assets/...` resolves against the published asset base
#             (the repo on GitHub raw), same as post imagery. Absolute URLs pass
#             through untouched.
#   gallery   optional. Up to 4 extra images, rendered as a thumbnail strip.
#   stats     optional. Display pills, free text so "200+" stays honest.
#   posts     optional. Post slugs, newest-first order is applied automatically.

events:
  - id: jachacks-sf-2026
    title: JacHacks SF
    kind: Hackathon
    start: 2026-07-26
    location: Founders, Inc., San Francisco, CA
    url: https://jachacks.org/
    summary: >-
      A single-day, in-person hackathon at Founders, Inc. 200+ builders shipped
      77 projects across three tracks (Agentic AI, Fintech/Open and Social
      Impact), plus three special awards, for a $9,000 prize pool.
    cover: https://jachacks.org/photos/sf_26/sf_01.webp
    gallery:
      - assets/jachacks-sf-2026/jachacks-sf-2026-buildroom.jpg
      - assets/jachacks-sf-2026/jachacks-sf-2026-demos.jpg
      - assets/jachacks-sf-2026/jachacks-sf-2026-hardware.jpg
    stats:
      - label: Builders
        value: 200+
      - label: Projects
        value: "77"
      - label: Tracks
        value: "3"
      - label: Prize pool
        value: $9,000
    posts:
      - jachacks-sf-2026-77-projects-in-one-day

